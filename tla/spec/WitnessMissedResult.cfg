\* Witness for Service.cfg: with retention by count, can a client that polls
\* slowly still find its finished job evicted?
\* Expected: NoMissedResult fails (retention is a count, not a time).
SPECIFICATION Spec
CONSTANTS
    Jobs = {j1, j2}
    Retention = 1
    Failures = {}
    Workers = {w1}
    QueueRestarts = 0
    Redeploys = 0
    Code = {"CleanUploads", "RetainFinished", "DeleteFiles", "OpenFirst", "SingleUse"}
INVARIANTS
    TypeOK
    NoMissedResult
