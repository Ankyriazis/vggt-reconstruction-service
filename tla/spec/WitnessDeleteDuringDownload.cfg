\* Witness for Service.cfg: does the model reach a job's directory being
\* deleted while its file is sent? DownloadsComplete passing there would
\* mean little otherwise.
\* Expected: NoDeleteDuringDownload fails.
SPECIFICATION Spec
CONSTANTS
    Jobs = {j1, j2}
    Retention = 1
    Failures = {}
    Workers = {w1}
    QueueRestarts = 0
    Redeploys = 0
    Code = {"CleanUploads", "RetainFinished", "DeleteFiles", "OpenFirst", "SingleUse"}
INVARIANTS
    TypeOK
    NoDeleteDuringDownload
